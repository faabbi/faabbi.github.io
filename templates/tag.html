{% extends 'base.html' %}
{% block head %}
<meta name="description" content="搜索 MJ 的文章，按标签查看靶场 WP 和学习笔记。">
<title>文章与搜索 - {{ blogBase['title'] }}</title>
{% endblock %}
{% block header %}
<h1 class="tagTitle">文章与搜索</h1>
<div class="title-right">
    <a href="{{ blogBase['homeUrl'] }}/" class="btn btn-invisible circle" title="首页" aria-label="首页"><svg class="octicon" width="16" height="16"><path id="pathHome"></path></svg></a>
    <button type="button" class="btn btn-invisible circle" onclick="modeSwitch()" title="切换主题" aria-label="切换主题"><svg class="octicon" width="16" height="16"><path id="themeSwitch"></path></svg></button>
</div>
{% endblock %}
{% block content %}
<form class="mj-search-form" role="search" id="mjSearchForm">
    <input type="search" id="mjSearchInput" aria-label="搜索文章标题或标签" placeholder="搜索标题或标签" autocomplete="off">
    <button type="submit">搜索</button>
</form>
<div id="taglabel" aria-label="按标签筛选"></div>
<p id="mjSearchStatus" class="mj-hint" role="status" aria-live="polite">正在载入文章…</p>
<nav class="SideNav" aria-label="文章列表"></nav>
<p class="notFind" hidden>没有找到相关文章，换个关键词试试。</p>
<noscript><p>搜索需要 JavaScript。可以回到<a href="{{ blogBase['homeUrl'] }}/">首页</a>按时间浏览文章。</p></noscript>
{% endblock %}
{% block script %}
<script src="{{ blogBase['homeUrl'] }}/js/search.js?v=20261027b"></script>
{% endblock %}
